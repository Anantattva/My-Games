  <body>
    <!-- ।। ॐ नमः शिवाय ।।  -->
    <div id="game">
      <div id="title">Guess the Number++</div>
      <div id="gameGenerator">
        <div id="maxValueText">
          <input id="maxValue" type="number" placeholder="Enter your max value:"></input>
        </div>
      </div>
      <div id="gameCards">
      </div>
      <div id="gameControls">
        <button id="guessBtn">Guess</button>
        <button id="generateBtn">Generate</button>
      </div>
    </div>
    <div id="gameOver">
      <div id="gameOutput">
        <div>Your number is: <span id="gameScore"></span>
        </div>
      </div>
    </div>
    <script src="Brain.js" defer></script>
