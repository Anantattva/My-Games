<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="Consciousness.js"></script>
    <link rel="stylesheet" href="Aesthetic.css">
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat+Brush&family=Euphoria+Script&family=Grand+Hotel&family=Great+Vibes&family=Kaushan+Script&family=Oleo+Script&display=swap" rel="stylesheet">
    <title>Snake Game</title>
  </head>
  <body>
    <div id="game">
      <h1>Snake</h1>
      <div id="scores">
        <h5>HIGH: <span id="highScore"></span>
        </h5>
        <h5>CURRENT: <span id="currentScore"></span>
        </h5>
      </div>
      <div id="gameGrid"></div>
      <div id="buttons">
        <div id="controlButtons">
          <button id="startButton">Start</button>
          <button id="pauseButton">Pause</button>
          <button id="restartButton">Restart</button>
        </div>
        <div id="movementButtons">
          <button id="moveUpButton">
            <span>&#9650</span>
          </button>
          <button id="moveRightButton">
            <span>&#9654</span>
          </button>
          <button id="moveLeftButton">
            <span>&#9664</span>
          </button>
          <button id="moveDownButton">
            <span>&#9660</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
